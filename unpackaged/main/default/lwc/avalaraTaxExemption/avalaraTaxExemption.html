<template>
    <div class="container">

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Main Content (not loading) -->
        <template if:false={isLoading}>

            <!-- ═══ REGISTERED STATE (read-only) ═══ -->
            <template if:true={isRegistered}>

                <!-- Registered Intro -->
                <div class="content intro">
                    <h1 class="intro-title">Tax Exemption</h1>
                    <p>Your organization is registered in our tax exemption system.
                       Below are your existing exemption certificates.</p>
                </div>

                <!-- Error -->
                <template if:true={errorMessage}>
                    <div class="content">
                        <div class="error-banner" role="alert">
                            <lightning-icon icon-name="utility:error" variant="error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span>{errorMessage}</span>
                        </div>
                    </div>
                </template>

                <div class="content">

                    <!-- Certificates Table -->
                    <div class="form-section">
                        <h2 class="section-title">Your Exemption Certificates</h2>

                        <template if:true={hasCertificates}>
                            <div class="table-wrapper">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col"><div class="slds-truncate">State/Region</div></th>
                                            <th scope="col"><div class="slds-truncate">Reason</div></th>
                                            <th scope="col"><div class="slds-truncate">Status</div></th>
                                            <th scope="col"><div class="slds-truncate">Signed Date</div></th>
                                            <th scope="col"><div class="slds-truncate">Expiration Date</div></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={certificates} for:item="cert">
                                            <tr key={cert.id}>
                                                <td><div class="slds-truncate">{cert.exposureZone}</div></td>
                                                <td><div class="slds-truncate">{cert.exemptionReason}</div></td>
                                                <td>
                                                    <span class={cert.statusClass}>{cert.status}</span>
                                                </td>
                                                <td><div class="slds-truncate">{cert.signedDate}</div></td>
                                                <td><div class="slds-truncate">{cert.expirationDate}</div></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:false={hasCertificates}>
                            <div class="empty-state">
                                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                                <span>No exemption certificates are currently on file for your organization.</span>
                            </div>
                        </template>
                    </div>

                </div>
            </template>

            <!-- ═══ UNREGISTERED STATE (informational only) ═══ -->
            <template if:false={isRegistered}>
                <div class="content intro">
                    <h1 class="intro-title">Tax Exemption</h1>
                    <p>Your organization isn't currently set up for tax exemption.
                       If you believe your organization qualifies, please contact us for assistance.</p>
                </div>
            </template>

        </template>

    </div>
</template>
